<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>吾妻 発注</title>
<!-- 吾妻 発注の枠。Google の帯を出さないため、Apps Script のページをこの中にはめ込む。
     行き先と人ごとの鍵はリンクの # の後ろ(#<デプロイのID>.<鍵>)だけにあり、このファイルには入れない。
     元は PC の 自動化/吾妻/発注/枠/index.html(GitHub Pages の azuma-hachu に置く) -->
<style>
html,body{margin:0;height:100%;background:#f6f7f9;font-family:system-ui,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#141922;color:#eef1f6}}
iframe{display:block;border:0;width:100%;height:100%}
p{font-size:18px;padding:16px;line-height:1.6}
</style>
</head>
<body>
<script>
(function () {
  var m = location.hash.slice(1).match(/^([\w-]{20,120})\.([0-9a-f]{32})$/);
  if (!m) {
    document.body.innerHTML = '<p>このリンクは使えません。LINE「吾妻発注」の「一覧から頼む」を押して、開き直してください。</p>';
    return;
  }
  var f = document.createElement('iframe');
  f.src = 'https://script.google.com/macros/s/' + m[1] + '/exec?t=' + m[2];
  f.title = '吾妻 発注';
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
